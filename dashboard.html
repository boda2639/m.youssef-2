<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الكورسات | منصة M.YOUSSEF</title>

    <meta
        name="description"
        content="استعرض جميع كورسات منصة مستر محمد يوسف التعليمية."
    >

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- Navbar -->
    <div id="navbarContainer"></div>

    <!-- Background -->
    <div class="background"></div>

    <!-- Hero -->
    <section class="courses-hero">

        <div class="hero-content">

            <span class="hero-badge">
                منصة M.YOUSSEF
            </span>

            <h1>
                جميع الكورسات
            </h1>

            <p>
                اختر الكورس المناسب ثم ادخل إلى الفصول وابدأ رحلة التعلم.
            </p>

        </div>

        <!-- Search -->

        <div class="search-container">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                id="courseSearch"
                type="search"
                placeholder="ابحث عن كورس..."
                autocomplete="off"
            >

        </div>

    </section>

    <!-- Courses -->

    <main
        id="courses"
        class="courses-section"
    >

        <div class="section-heading">

            <div class="section-title">

                <span class="mini-title">

                    الكورسات

                </span>

                <h2>

                    جميع الكورسات المتاحة

                </h2>

            </div>

            <div
                id="coursesCount"
                class="courses-count"
            >

                جاري تحميل الكورسات...

            </div>

        </div>

        <!-- Loading -->

        <div
            id="loadingBox"
            class="loading-box"
        >

            <div class="loading-icon">

                <i class="fa-solid fa-spinner fa-spin"></i>

            </div>

            <span>

                جاري تحميل الكورسات...

            </span>

        </div>

        <!-- Courses Grid -->

        <section
            id="coursesContainer"
            class="courses-grid"
        >

        </section>

        <!-- Empty -->

        <div
            id="emptyState"
            class="empty-state"
        >

            <div class="empty-icon">

                <i class="fa-solid fa-book-open"></i>

            </div>

            <h3>

                لا توجد كورسات

            </h3>

            <p>

                سيتم إضافة الكورسات قريبًا.

            </p>

        </div>

    </main>

    <!-- JS -->

    <script
        type="module"
        src="dashboard.js"
    ></script>

    <script src="navbar.js"></script>
    <script src="navbar-loader.js"></script>

</body>

</html>
