<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>فصول الكورس | M.YOUSSEF</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="chapters.css">

</head>

<body>

    <!-- NAVBAR -->

    <div id="navbarContainer"></div>

    <!-- BACKGROUND -->

    <div class="background"></div>

    <!-- PAGE -->

    <main class="chapters-page">

        <!-- HEADER -->

        <header class="chapter-header">

            <div class="header-content">

                <span class="page-badge">

                    <i class=></i>

                     

                </span>

                <h1 id="courseTitle">

                    جاري تحميل الكورس...

                </h1>

                <p id="courseDescription">

                    اختر الفصل الذي تريد البدء به.

                </p>

            </div>

        </header>
                <!-- ===================================== -->
        <!-- LOADING -->
        <!-- ===================================== -->

        <section
            id="loadingBox"
            class="loading-box">

            <div class="loading-card"></div>

            <div class="loading-card"></div>

            <div class="loading-card"></div>

            <div class="loading-card"></div>

            <div class="loading-card"></div>

            <div class="loading-card"></div>

        </section>



        <!-- ===================================== -->
        <!-- ERROR -->
        <!-- ===================================== -->

        <section
            id="errorBox"
            class="error-box hidden">

            <div class="error-card">

                <i class="fa-solid fa-circle-exclamation"></i>

                <h2>

                    حدث خطأ

                </h2>

                <p id="errorText">

                    تعذر تحميل الفصول.

                </p>

                <a href="dashboard.html">

                    <i class="fa-solid fa-arrow-right"></i>

                    الرجوع للكورسات

                </a>

            </div>

        </section>



        <!-- ===================================== -->
        <!-- CONTENT -->
        <!-- ===================================== -->

        <section
            id="chaptersContent"
            class="hidden">

            <div class="section-title">

                <i class="fa-solid fa-book-open"></i>

                <div>

                    <h2>

                        جميع الفصول

                    </h2>

                    <p>

                        

                    </p>

                </div>

            </div>



            <div
                id="chaptersContainer"
                class="chapters-grid">

                <!-- Chapters -->

            </div>

        </section>
            </main>


    <!-- ===================================== -->
    <!-- SCROLL TO TOP -->
    <!-- ===================================== -->

    <button
        id="scrollTopBtn"
        class="scroll-top">

        <i class="fa-solid fa-arrow-up"></i>

    </button>


    <!-- ===================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================== -->

    <script type="module" src="chapters.js"></script>

    <script src="navbar-loader.js"></script>

    <script>

        // زر الرجوع لأعلى

        const scrollBtn = document.getElementById("scrollTopBtn");

        window.addEventListener("scroll", () => {

            if (window.scrollY > 300) {

                scrollBtn.classList.add("show");

            } else {

                scrollBtn.classList.remove("show");

            }

        });

        scrollBtn.addEventListener("click", () => {

            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        });

    </script>

</body>

</html>
